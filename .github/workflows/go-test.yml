name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:


  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        services: [order-service, notification-service]
    defaults:
      run:
        working-directory: ./{{
          matrix.services
        }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
